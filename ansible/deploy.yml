# Deploys (or updates) the app on AKS.
# Run by the pipeline:  ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e image=<full image name>
- name: Deploy devops-app to Azure Kubernetes Service
  hosts: deployer
  gather_facts: false

  vars:
    manifest_dir: "{{ playbook_dir }}/../k8s"
    rendered_dir: "/tmp/k8s-rendered"

  tasks:
    - name: Fail early if no image was passed in
      ansible.builtin.assert:
        that: image is defined and image | length > 0
        fail_msg: "Pass the image with -e image=<registry>/devops-app:<tag>"

    - name: Create a folder for the final manifests
      ansible.builtin.file:
        path: "{{ rendered_dir }}"
        state: directory

    - name: Copy the Kubernetes manifests
      ansible.builtin.copy:
        src: "{{ manifest_dir }}/"
        dest: "{{ rendered_dir }}/"

    - name: Put the new image tag into the Deployment
      ansible.builtin.replace:
        path: "{{ rendered_dir }}/deployment.yaml"
        regexp: "IMAGE_PLACEHOLDER"
        replace: "{{ image }}"

    - name: Apply the manifests to the cluster
      ansible.builtin.command: kubectl apply -f {{ rendered_dir }}
      register: apply_result
      changed_when: "'configured' in apply_result.stdout or 'created' in apply_result.stdout"

    - name: Show what Kubernetes changed
      ansible.builtin.debug:
        var: apply_result.stdout_lines

    - name: Wait until the rollout has finished
      ansible.builtin.command: kubectl rollout status deployment/devops-app --timeout=300s
      changed_when: false
