# ==========================================================================
# CI/CD pipeline: runs automatically on every push to the main branch.
#   1. build-and-test  -> Maven compiles the code and runs the JUnit tests
#   2. docker          -> builds the Docker image and pushes it to Azure ACR
#   3. deploy          -> Ansible deploys the new image to Azure AKS
#   4. verify          -> checks the pods are ready and the live URL shows
#                         the new version
# If any job fails, the jobs after it do not run.
# ==========================================================================
name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:          # also allows a manual "Run workflow" button

permissions:
  id-token: write             # needed to log in to Azure with OIDC (no stored password)
  contents: read

env:
  ACR_NAME: vidyuthdevopsacr
  RESOURCE_GROUP: cia2-devops-rg
  AKS_CLUSTER: cia2-aks-cluster
  IMAGE_NAME: devops-app

jobs:
  # ------------------------------------------------------------------ 1
  build-and-test:
    name: 1. Build & Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, run unit tests and package the jar
        run: mvn -B clean verify

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Save the jar for the next job
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  # ------------------------------------------------------------------ 2
  docker:
    name: 2. Docker Build & Push (ACR)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Download the jar built in job 1
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Build and tag the image (tag = commit SHA)
        run: |
          IMAGE=$ACR_NAME.azurecr.io/$IMAGE_NAME
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push the image to ACR
        run: |
          IMAGE=$ACR_NAME.azurecr.io/$IMAGE_NAME
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  # ------------------------------------------------------------------ 3
  deploy:
    name: 3. Deploy to AKS (Ansible)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect kubectl to the AKS cluster
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_CLUSTER --overwrite-existing

      - name: Make sure Ansible is installed
        run: command -v ansible-playbook || pipx install --include-deps ansible-core

      - name: Run the Ansible deployment playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e image=$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

  # ------------------------------------------------------------------ 4
  verify:
    name: 4. Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Connect kubectl to the AKS cluster
        run: az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_CLUSTER --overwrite-existing

      - name: Show deployment, pods and service
        run: |
          kubectl get deployment devops-app
          kubectl get pods -l app=devops-app -o wide
          kubectl get service devops-app-service

      - name: Check the live app shows the new version
        run: |
          EXPECTED=$(grep -oP 'APP_VERSION = "\K[^"]+' src/main/java/com/cia2/devops/GreetingService.java)
          echo "Expected version: $EXPECTED"

          for i in $(seq 1 30); do
            IP=$(kubectl get service devops-app-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$IP" ] && break
            echo "Waiting for public IP..."; sleep 10
          done

          for i in $(seq 1 30); do
            LIVE=$(curl -s --max-time 5 http://$IP/version || true)
            echo "Attempt $i: live version = '$LIVE'"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "### ✅ Deployment verified" >> $GITHUB_STEP_SUMMARY
              echo "App URL: http://$IP  — showing **$LIVE**" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            sleep 10
          done
          echo "Live app did not show $EXPECTED"; exit 1
